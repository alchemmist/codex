name: antex-release

on:
  push:
    tags:
      - "antex-v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap pkg-config libssl-dev
      - name: Install test runner
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest@0.9.143
      - name: Validate tag and version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("antex-rs/Cargo.toml","rb"))["workspace"]["package"]["version"])')
          test "${GITHUB_REF_NAME}" = "antex-v${version}"
      - name: Check formatting
        run: just fmt-check
      - name: Run tests
        env:
          ANTEX_BWRAP: /usr/bin/bwrap
        run: just test
      - name: Run Clippy
        run: just clippy -- -D warnings
      - name: Build release
        working-directory: antex-rs
        run: cargo build --locked --release --bin antex
      - name: Package binary
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#antex-v}
          binary="antex-rs/target/release/antex"
          if [ "${RUNNER_OS}" = macOS ]; then
            codesign --force --sign - "$binary"
          else
            strip "$binary"
          fi
          if [ "${RUNNER_OS}" = macOS ]; then
            bytes=$(stat -f%z "$binary")
          else
            bytes=$(stat -c%s "$binary")
          fi
          test "$bytes" -le 41943040
          test "$("$binary" --version)" = "antex $version"
          archive="antex-${{ matrix.target }}.tar.gz"
          tar -C "$(dirname "$binary")" -czf "$archive" antex
          if [ "${RUNNER_OS}" = macOS ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: antex-${{ matrix.target }}
          path: |
            antex-${{ matrix.target }}.tar.gz
            antex-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#antex-v}
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Antex v$version" \
            --generate-notes \
            --latest
