[package]
name = "antex-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
antex-core = { path = "../core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-widget-ref", "unstable-rendered-line-info", "scrolling-regions", "unstable-backend-writer"] }
tokio.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1.12"
textwrap = "0.16"
derive_more = { version = "2", features = ["is_variant"] }
url = "2"
tracing = "0.1"
futures = "0.3"

[dev-dependencies]
pretty_assertions = "1"
insta = "1"
toml = "1"
vt100 = "0.16.2"
itertools = "0.14"
tempfile = "3"
rand = "0.9"
chrono = "0.4"
