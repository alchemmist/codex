[workspace]
members = ["core", "provider-openai", "runtime"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
futures = "0.3"
jsonschema = { version = "0.54.0", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
