[package]
name = "antex-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
antex-core = { path = "../core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-widget-ref", "unstable-rendered-line-info", "scrolling-regions", "unstable-backend-writer"] }
tokio.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1.12"
textwrap = "0.16"
derive_more = { version = "2", features = ["is_variant"] }
url = "2"
tracing = "0.1"
futures = "0.3"
supports-color = "3"
libc = "0.2"
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }
regex-lite = "0.1.8"
urlencoding = "2"
diffy = "0.4"
pathdiff = "0.2"
base64 = "0.22"
arboard = { version = "3", features = ["wayland-data-control"] }
shlex = "1"
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
itertools = "0.14"

[dev-dependencies]
pretty_assertions = "1"
insta = "1"
toml = "1"
vt100 = "0.16.2"
tempfile = "3"
rand = "0.9"
chrono = "0.4"
